<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #0a0e1a;
            transition: background 0.5s ease, color 0.5s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
        }

        body.light-mode {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        }

        body.light-mode .glass-container {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        body.light-mode .game-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        body.light-mode .game-card h3 {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.light-mode .game-card p {
            color: #2d3436;
        }

        body.light-mode .glitch {
            color: #1a1a2e;
            text-shadow: 2px 0 #ff0055, -2px 0 #00ffff, 0 2px #ff0, 0 -2px #0f0;
        }

        body.light-mode .footer-stats {
            color: #2d3436;
        }

        body.light-mode .stats-item {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }


        .name-header {
            text-align: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        .glitch {
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 2px 0 #ff0055, -2px 0 #00ffff, 0 2px #ff0, 0 -2px #0f0;
            position: relative;
            text-transform: uppercase;
            font-family: 'Arial Black', sans-serif;
            display: inline-block;
            animation: shake 0.15s infinite alternate;
            font-weight: 900;
            letter-spacing: 3px;
        }
        
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            width: 100%;
            opacity: 0.8;
            clip: rect(0, 900px, 0, 0);
        }
        
        .glitch::before {
            animation: glitchTop 2s infinite linear alternate-reverse;
            color: #ff0055;
        }
        
        .glitch::after {
            animation: glitchBottom 3s infinite linear alternate-reverse;
            color: #00ffff;
        }

        @keyframes shake {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, 1px); }
        }

        @keyframes glitchTop {
            0% { clip: rect(0,900px,5px,0); transform: translate(-3px,-3px);}
            20% { clip: rect(0,900px,10px,0); transform: translate(3px,3px);}
            40% { clip: rect(5px,900px,15px,0); transform: translate(-3px,2px);}
            60% { clip: rect(10px,900px,20px,0); transform: translate(3px,-2px);}
            80% { clip: rect(15px,900px,25px,0); transform: translate(-2px,1px);}
            100% { clip: rect(20px,900px,30px,0); transform: translate(2px,-1px);}
        }
        
        @keyframes glitchBottom {
            0% { clip: rect(30px,900px,35px,0); transform: translate(2px,1px);}
            20% { clip: rect(25px,900px,30px,0); transform: translate(-2px,-1px);}
            40% { clip: rect(20px,900px,25px,0); transform: translate(3px,2px);}
            60% { clip: rect(15px,900px,20px,0); transform: translate(-3px,-2px);}
            80% { clip: rect(10px,900px,15px,0); transform: translate(2px,1px);}
            100% { clip: rect(5px,900px,10px,0); transform: translate(-2px,-1px);}
        }

        .subtitle {
            color: #b9c8ff;
            font-size: 1.1rem;
            margin-top: 8px;
            opacity: 0.8;
        }


        .glass-container {
            position: relative;
            z-index: 10;
            max-width: 1300px;
            width: 100%;
            background: rgba(10, 14, 30, 0.6);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 3rem;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.5s ease;
        }


        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(255, 215, 0, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-left i {
            font-size: 2.8rem;
            color: #ffd700;
            filter: drop-shadow(0 0 20px #ffd70055);
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.1) rotate(5deg);
            }
        }

        .header-left h2 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .theme-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            box-shadow: 0 0 30px #ffd70033;
        }

        .header .tagline {
            color: #b9c8ff;
            font-size: 1rem;
            background: rgba(0, 20, 40, 0.4);
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            border-left: 3px solid #ffd700;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.2rem;
            margin-top: 0.5rem;
        }


        .game-card {
            background: rgba(12, 18, 38, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 1.8rem 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            color: #eef3ff;
            transform-style: preserve-3d;
            perspective: 1000px;
        }


        .game-card::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ffd700, #ff6b6b, #4ecdc4, #45b7d1, #ffd700);
            background-size: 400% 400%;
            border-radius: 2.6rem;
            z-index: -1;
            animation: hologram 4s linear infinite;
            opacity: 0;
            transition: opacity 0.5s ease;
            filter: blur(2px);
        }

        .game-card:hover::after {
            opacity: 0.6;
        }

        @keyframes hologram {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-card:hover {
            transform: translateY(-15px) scale(1.02) rotateX(3deg) rotateY(3deg);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 215, 0, 0.2);
        }

        .game-card .icon {
            font-size: 3.2rem;
            color: #ffd700;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 0 15px #ffd70044);
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 0.9rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            transition: all 0.4s ease;
        }

        .game-card:hover .icon {
            transform: scale(1.15) rotate(10deg) translateY(-5px);
            color: #ffe066;
            filter: drop-shadow(0 0 30px #ffd70088);
        }

        .game-card h3 {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, #f0f4ff, #a8c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-card p {
            color: #b2c6f0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.2rem;
            opacity: 0.9;
        }


        .game-card .meta {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.9rem;
        }

        .btn-play {
            background: linear-gradient(145deg, #ffb347, #f57c00);
            border: none;
            color: #0b0e1a;
            font-weight: 700;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 8px 25px rgba(245, 124, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-play:hover {
            transform: scale(1.08) translateY(-3px);
            background: linear-gradient(145deg, #ffb347, #ff9100);
            box-shadow: 0 12px 35px rgba(245, 124, 0, 0.5);
            color: #000;
        }

        .btn-play i {
            font-size: 1rem;
        }


        .game-card.special {
            background: rgba(30, 15, 50, 0.6);
            border: 1px solid rgba(200, 100, 255, 0.2);
        }

        .game-card.special .icon {
            color: #d58eff;
            filter: drop-shadow(0 0 20px #b35cff55);
        }

        .game-card.special .btn-play {
            background: linear-gradient(145deg, #a55aff, #7b2fbe);
            box-shadow: 0 8px 25px #7b2fbe66;
        }

        .game-card.special .btn-play:hover {
            background: linear-gradient(145deg, #b56aff, #8f3fce);
            box-shadow: 0 12px 35px #7b2fbe99;
        }


        .footer-stats {
            margin-top: 3.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(255, 215, 0, 0.08);
            color: #aec3ff;
            gap: 15px;
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.4rem 1.8rem 0.4rem 1.4rem;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        .stats-item:hover {
            transform: translateY(-3px);
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.2);
        }

        .stats-item i {
            color: #ffd700;
            font-size: 1.5rem;
        }


        @media (max-width: 768px) {
            .glass-container {
                padding: 1.8rem 1.2rem;
                border-radius: 2rem;
            }
            .glitch {
                font-size: 2.5rem;
            }
            .header-left i {
                font-size: 2.2rem;
            }
            .header-left h2 {
                font-size: 2rem;
            }
            .header .tagline {
                font-size: 0.8rem;
                padding: 0.3rem 1rem;
            }
            .game-card {
                padding: 1.5rem;
            }
            .footer-stats {
                flex-direction: column;
                align-items: stretch;
            }
            .stats-item {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .glitch {
                font-size: 2rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .header-left h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="glass-container">

        <div class="header">
            <div class="header-left">
                <i class="fas fa-gamepad"></i>
                <h2>پروژه‌ها</h2>
            </div>
            <div class="header-actions">
                <div class="tagline">
                    <i class="fas fa-rocket" style="color: #ffd700;"></i>
                    <span>بازی‌های آنلاین</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="تغییر مود شب/روز">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <div class="projects-grid">

            <div class="game-card" data-game="1" data-url="https://ejei-sch.github.io/lobby/bedwars/">
                <div class="icon"><i class="fas fa-wand-magic"></i></div>
                <h3>1</h3>
                <p>بدوارز انلاین با اسکین های متفاوت</p>
                <div class="meta">
                    <a href="#" class="btn-play"><i class="fas fa-play"></i> بازی</a>
                </div>
            </div>

            <div class="game-card special" data-game="2" data-url="https://ejei-sch.github.io/lobby/arena/">
                <div class="icon"><i class="fas fa-ghost"></i></div>
                <h3>2</h3>
                <p>ارنا نبرد انلاین</p>
                <div class="meta">
                    <a href="#" class="btn-play"><i class="fas fa-play"></i> بازی</a>
                </div>
            </div>


            <div class="game-card" data-game="3" data-url="https://ejei-sch.github.io/lobby/robo">
                <div class="icon"><i class="fas fa-robot"></i></div>
                <h3>3</h3>
                <p>جنگ ربات های انلاین بین بازیکنان</p>
                <div class="meta">
                    <a href="#" class="btn-play"><i class="fas fa-play"></i> بازی</a>
                </div>
            </div>

        </div>


        <div class="footer-stats">
            <div class="stats-item">
                <i class="fas fa-trophy"></i>
                <span>3 بازی فعال · پروژه‌های ویژه ۲۰۲۶</span>
            </div>
            <div class="stats-item">
                <i class="fas fa-globe"></i>
                <span>پرهام مومنی</span>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';


            document.querySelectorAll('.btn-play').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const card = this.closest('.game-card');
                    const gameName = card.dataset.game || 'بازی';
                    const url = card.dataset.url || '#';
                    window.open(url, '_blank');
                });
            });


            const themeToggle = document.getElementById('themeToggle');
            let isLight = false;

            themeToggle.addEventListener('click', function() {
                isLight = !isLight;
                document.body.classList.toggle('light-mode', isLight);

                const icon = this.querySelector('i');
                if (isLight) {
                    icon.className = 'fas fa-sun';
                    this.style.color = '#f39c12';
                } else {
                    icon.className = 'fas fa-moon';
                    this.style.color = '#ffd700';
                }

                this.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });

        })();
    </script>

</body>
</html>
